name: CI

# Runs on every push and PR against main. Two independent jobs (backend,
# frontend) run in parallel — a failure in one doesn't block the other from
# reporting, and together they gate merges via branch protection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, test, docker build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Caches pip downloads between runs, keyed on requirements.txt so
          # the cache invalidates automatically when deps change.
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      # The Unstructured PDF pipeline needs these at import/parse time, same
      # as the system packages installed in the Dockerfile — the runner here
      # is a bare VM, not the container, so it needs its own copy.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr libmagic1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q

      - name: Build Docker image
        run: docker build -t finsight-backend:ci .

  frontend:
    name: Frontend (lint, typecheck, build, docker build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # npm ci (vs. npm install) requires an existing package-lock.json and
      # installs exactly what it specifies — reproducible, and faster in CI.
      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      # `npm run build` runs `tsc -b` (typecheck) before `vite build`, so a
      # type error fails the build step rather than silently shipping.
      - name: Typecheck + build
        run: npm run build

      - name: Build Docker image
        run: docker build -t finsight-frontend:ci .

  compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    # Only worth the extra build time if the components already pass on
    # their own — this rebuilds both images fresh (no cache shared with the
    # jobs above, since each runs on its own VM).
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # No real API keys in CI (and none requested as repo secrets for
      # this) — a placeholder .env is enough to prove the stack starts and
      # every service can reach every other service.
      - name: Create a placeholder .env
        run: cp backend/.env.example backend/.env

      - name: Build and start the stack, waiting for every healthcheck
        run: docker compose up -d --build --wait

      - name: Hit the API directly
        run: curl -sf http://localhost:8000/health

      - name: Hit the API through the frontend's nginx proxy
        run: curl -sf http://localhost:3000/api/health

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
