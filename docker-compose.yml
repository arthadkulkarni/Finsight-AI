services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333" # REST API + built-in dashboard at /dashboard
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl/wget — a raw TCP connect via bash's
      # /dev/tcp is the lightest check available without adding tooling.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Container-networking values, not secrets — set here rather than in
      # the shared .env, which also gets used for bare-metal local runs
      # where these hostnames wouldn't resolve.
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Shared with worker: the API writes an uploaded PDF here, and the
      # worker (a separate container) needs to read that same file path.
      - uploads_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: ./backend
    command: celery -A app.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads_data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app inspect ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  qdrant_storage:
  uploads_data:
