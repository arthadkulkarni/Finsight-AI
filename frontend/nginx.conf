server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container so the frontend can
    # just call relative paths like /api/chat — no CORS, no hardcoded host.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /api/chat streams an SSE response — buffering would hold the
        # whole answer until it finished, defeating the point of streaming.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: unknown paths serve index.html instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
